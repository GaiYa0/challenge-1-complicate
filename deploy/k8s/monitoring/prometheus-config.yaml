apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: challenge-demo
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s
      external_labels:
        cluster: challenge-demo
    scrape_configs:
      - job_name: backend
        metrics_path: /metrics
        static_configs:
          - targets: ["backend:8000"]
        relabel_configs:
          - target_label: kubernetes_namespace
            replacement: challenge-demo
      - job_name: redis
        static_configs:
          - targets: ["redis:6379"]
        metrics_path: /metrics
