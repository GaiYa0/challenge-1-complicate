map $http_x_request_id $trace_id {
    ""      $request_id;
    default $http_x_request_id;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 便于与后端 JSON 访问日志中的 request_id 对齐（客户端未传则由 Nginx 生成）
    add_header X-Request-ID $trace_id always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # 与后端 MAX_UPLOAD_BYTES（50MB）对齐；默认 1m 会导致大文件上传 413
        client_max_body_size 52m;
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $trace_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 与网关 file 上游 120s、大文件上传一致；过短会导致后端仍在处理时 Nginx 先返回 504
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /ws {
        proxy_pass http://backend:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $trace_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }
}
