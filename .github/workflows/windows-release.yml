# 构建 Windows 便携包并发布到 GitHub Releases
# 触发方式：
#   1. 推送标签 v*（如 v1.0.0）→ 自动创建 Release 并上传 ZIP
#   2. Actions → windows-release → Run workflow（可填版本号）
#   3. 在 Releases 页手动创建版本并发布 → 补充上传 ZIP（需已存在 tag）
name: windows-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release 标签（如 v1.0.0）；留空则使用 windows-<运行编号>"
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows-bundle:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve release tag
        id: rel
        shell: pwsh
        run: |
          $tag = ""
          if ("${{ github.event_name }}" -eq "release") {
            $tag = "${{ github.event.release.tag_name }}"
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } elseif ("${{ inputs.version }}" -ne "") {
            $tag = "${{ inputs.version }}"
          } else {
            $tag = "windows-${{ github.run_number }}"
          }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Release tag: $tag"

      - name: Build ChallengeDemo.exe
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/windows/requirements-build.txt
          pyinstaller --noconfirm --clean packaging/windows/challenge-demo.spec
          if (-not (Test-Path dist/ChallengeDemo.exe)) {
            throw "ChallengeDemo.exe not found"
          }

      - name: Stage portable ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.rel.outputs.tag }}"
          & packaging/windows/stage-release.ps1 -ExePath dist/ChallengeDemo.exe -Version $version

      - name: Collect artifact name
        id: zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path dist -Filter "challenge-demo-windows-*.zip" | Select-Object -First 1
          if (-not $zip) { throw "ZIP not found under dist/" }
          echo "path=$($zip.FullName)" >> $env:GITHUB_OUTPUT
          echo "name=$($zip.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.zip.outputs.name }}
          path: dist/challenge-demo-windows-*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: Challenge Demo ${{ steps.rel.outputs.tag }} (Windows)
          files: dist/challenge-demo-windows-*.zip
          generate_release_notes: true
          prerelease: ${{ !startsWith(steps.rel.outputs.tag, 'v') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
