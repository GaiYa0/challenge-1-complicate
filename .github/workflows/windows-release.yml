# 构建 ChallengeDemo.exe 并发布到 GitHub Releases（含独立 .exe 与完整便携 ZIP）
name: windows-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release 标签（如 v1.0.0）；留空则使用 windows-<运行编号>"
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows-bundle:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve release tag
        id: rel
        shell: pwsh
        run: |
          $tag = ""
          if ("${{ github.event_name }}" -eq "release") {
            $tag = "${{ github.event.release.tag_name }}"
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}"
          } elseif ("${{ inputs.version }}" -ne "") {
            $tag = "${{ inputs.version }}"
          } else {
            $tag = "windows-${{ github.run_number }}"
          }
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Release tag: $tag"

      - name: Build ChallengeDemo.exe
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/windows/requirements-build.txt
          New-Item -ItemType Directory -Force -Path dist, build/pyinstaller | Out-Null
          python -m PyInstaller `
            --noconfirm --clean --onefile --noupx `
            --name ChallengeDemo `
            --distpath dist `
            --workpath build/pyinstaller `
            --specpath build/pyinstaller `
            packaging/windows/launcher.py
          $exe = Join-Path dist "ChallengeDemo.exe"
          if (-not (Test-Path $exe)) {
            Write-Host "::group::dist tree"
            Get-ChildItem -Recurse dist, build/pyinstaller -ErrorAction SilentlyContinue
            Write-Host "::endgroup::"
            throw "未生成 dist/ChallengeDemo.exe"
          }
          Write-Host "Built: $exe ($(Get-Item $exe).Length bytes)"

      - name: Stage portable ZIP
        shell: pwsh
        run: |
          $version = "${{ steps.rel.outputs.tag }}"
          & packaging/windows/stage-release.ps1 `
            -ExePath "$env:GITHUB_WORKSPACE\dist\ChallengeDemo.exe" `
            -Version $version

      - name: Collect artifact paths
        id: assets
        shell: pwsh
        run: |
          $exe = Join-Path dist "ChallengeDemo.exe"
          $zip = Get-ChildItem -Path dist -Filter "challenge-demo-windows-*.zip" | Select-Object -First 1
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          if (-not $zip) { throw "ZIP not found under dist/" }
          echo "exe=$exe" >> $env:GITHUB_OUTPUT
          echo "zip=$($zip.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChallengeDemo-windows-${{ steps.rel.outputs.tag }}
          path: |
            dist/ChallengeDemo.exe
            dist/challenge-demo-windows-*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: Challenge Demo ${{ steps.rel.outputs.tag }} (Windows)
          body: |
            ## 下载说明

            | 文件 | 说明 |
            |------|------|
            | **ChallengeDemo.exe** | 启动器（需本机已安装 [Docker Desktop](https://www.docker.com/products/docker-desktop/)） |
            | **challenge-demo-windows-*.zip** | 便携完整包（exe + 源码 + compose），解压后运行 exe |

            演示账号（`.env.dev`）：`admin` / `admin`  
            访问地址：<http://127.0.0.1:8080>
          files: |
            dist/ChallengeDemo.exe
            dist/challenge-demo-windows-*.zip
          generate_release_notes: true
          prerelease: ${{ !startsWith(steps.rel.outputs.tag, 'v') }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
