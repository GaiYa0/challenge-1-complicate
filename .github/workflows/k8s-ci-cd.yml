# CI/CD：构建镜像 → 漏洞扫描 → 推送 GHCR →（可选）滚动更新 K8s Deployment
# 可选 Secret：KUBE_CONFIG（base64 编码的 kubeconfig）；未配置时跳过 deploy 作业
# GHCR 镜像路径必须全小写，故对 github.repository_owner 做 tr 转换
name: k8s-ci-cd

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_sha: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: GHCR 镜像基路径（owner 转小写，满足 Docker 仓库名规范）
        id: image
        run: |
          o=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "tag=ghcr.io/${o}/challenge-demo" >> "$GITHUB_OUTPUT"

      - name: Set image metadata
        id: meta
        run: echo "sha_tag=${{ steps.image.outputs.tag }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.sha_tag }}

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.meta.outputs.sha_tag }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: production
    steps:
      # job 级 if 不能使用 secrets 上下文，在 step 内检测后跳过
      - name: Check KUBE_CONFIG
        id: gate
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG }}
        run: |
          if [ -z "$KUBE_CONFIG_B64" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::KUBE_CONFIG 未配置，跳过 K8s 部署"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup kubectl
        if: steps.gate.outputs.skip != 'true'
        uses: azure/setup-kubectl@v4
        with:
          version: v1.29.0

      - name: Deploy to Kubernetes
        if: steps.gate.outputs.skip != 'true'
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG }}
          IMAGE_REF: ${{ needs.build-and-push.outputs.image_sha }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

          kubectl get deployment/backend -n challenge-demo || {
            echo "::error::deployment/backend 不存在，请先 apply K8s 清单"
            exit 1
          }

          kubectl set image deployment/backend \
            backend="${IMAGE_REF}" \
            -n challenge-demo

          kubectl rollout status deployment/backend \
            -n challenge-demo --timeout=300s
