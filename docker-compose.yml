# 一键启动：docker compose up -d（含前端 web:8080 → /api、/ws 反代后端）
# 网络内 DNS：postgres / redis / minio / zookeeper / kafka / neo4j
# 敏感凭据通过 .env.dev 注入；生产环境使用 docker secrets 或密钥管理服务

name: challenge-demo

x-backend-build: &backend_build
  context: .
  dockerfile: Dockerfile

networks:
  app-net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  kafka_data:
  zookeeper_data:
  zookeeper_log:
  neo4j_data:

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: challenge-zookeeper
    networks: [app-net]
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    # ZK 3.5+ 默认四字命令白名单不含 ruok，用 srvr（默认允许）+ 127.0.0.1 避免 ::1 连不上
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 5 127.0.0.1 2181 | grep -q Mode"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 60s

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: challenge-kafka
    networks: [app-net]
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server 127.0.0.1:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  postgres:
    image: postgres:15-alpine
    container_name: challenge-postgres
    networks: [app-net]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-dbname}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d ${DB_NAME:-dbname}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: challenge-redis
    networks: [app-net]
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: challenge-minio
    networks: [app-net]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    # 该镜像无 curl/wget，用内置 mc 连本机 API 做就绪探测
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mc alias set hc http://127.0.0.1:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" >/dev/null 2>&1 && mc ready hc",
        ]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 40s

  neo4j:
    image: neo4j:5-community
    container_name: challenge-neo4j
    networks: [app-net]
    restart: unless-stopped
    ports:
      - "127.0.0.1:7687:7687"
      - "127.0.0.1:7474:7474"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-dev032500}"
    volumes:
      - neo4j_data:/data
    # HTTP 7474 在部分版本/阶段不可靠；用 Bolt + cypher-shell（密码与 NEO4J_AUTH 一致）
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -a bolt://127.0.0.1:7687 -u neo4j -p \"${NEO4J_PASSWORD:-dev032500}\" 'RETURN 1' || exit 1",
        ]
      interval: 15s
      timeout: 15s
      retries: 12
      start_period: 90s

  backend:
    build: *backend_build
    container_name: challenge-backend
    networks: [app-net]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env.dev
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-dev032500}"
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_UPLOAD_FALLBACK_CELERY: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  celery-worker:
    build: *backend_build
    container_name: challenge-celery-worker
    networks: [app-net]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    env_file:
      - .env.dev
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-dev032500}"
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_UPLOAD_FALLBACK_CELERY: "false"
    command: ["celery", "-A", "backend.tasks.celery_app", "worker", "--loglevel=info"]

  kafka-consumer:
    build: *backend_build
    container_name: challenge-kafka-consumer
    networks: [app-net]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      celery-worker:
        condition: service_started
    env_file:
      - .env.dev
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      MINIO_ENDPOINT: minio:9000
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-dev032500}"
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    command: ["python", "-m", "backend.events.kafka_consumer"]

  # 前端静态资源 + Nginx 反代 /api、/ws → backend（浏览器只访问本服务端口即可）
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: challenge-web
    networks: [app-net]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
