# Kafka 兼容（Redpanda）：本地事件总线 + 业务 topics
# 启动：docker compose -f docker-compose.kafka.yml up -d
# 宿主机应用连接：KAFKA_ENABLED=true KAFKA_BOOTSTRAP_SERVERS=localhost:19092
# 同 compose 网络内服务：KAFKA_BOOTSTRAP_SERVERS=redpanda:9092

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.10
    container_name: challenge-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --node-id
      - "0"
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
      - --pandaproxy-addr
      - 0.0.0.0:8082
      - --advertise-pandaproxy-addr
      - localhost:18082
    ports:
      - "19092:19092"
      - "18082:18082"
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s

  kafka-init:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.10
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        TOPICS=("data-uploaded" "data-processed" "model-trained" "prediction-done" "events-dlq")
        RETENTION="604800000"
        DLQ_RETENTION="2592000000"
        for t in "$${TOPICS[@]}"; do
          ret="$$RETENTION"
          [ "$$t" = "events-dlq" ] && ret="$$DLQ_RETENTION"
          if rpk -X brokers=redpanda:9092 topic create "$$t" --topic-config "retention.ms=$$ret" 2>&1; then
            echo "  ✓ $$t"
          elif rpk -X brokers=redpanda:9092 topic list | grep -q "^$$t"; then
            echo "  ✓ $$t (exists)"
          else
            echo "  ✗ Failed: $$t" && exit 1
          fi
        done
        echo "All Kafka topics ready."
